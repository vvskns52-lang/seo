<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한반도 행정구역 익히기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root{
    --bg:#f6f7f9; --panel:#ffffff;
    --ink:#161a1f; --ink-2:#5b6470; --ink-3:#8c95a1;
    --line:#e4e7ec; --line-2:#eef0f4;
    --accent:#2f62e8; --accent-soft:#eaf0ff;
    --ok:#1f9d63; --ok-soft:#e6f6ee;
    --no:#d8493f; --no-soft:#fdecea;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.55;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 56px;}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .brand h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .brand p{margin:3px 0 0;color:var(--ink-3);font-size:13px;}
  .tabs{display:inline-flex;background:#eceef2;border-radius:11px;padding:3px;gap:2px;}
  .tabs button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 16px;border-radius:8px;transition:.16s;white-space:nowrap;}
  .tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.10);}

  .cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
  .card .hd h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .card .bd{padding:16px;}

  .mapbox{padding:4px 8px 10px;}
  svg.map{display:block;margin:0 auto;width:100%;max-width:640px;height:auto;}
  .mapbox.small svg.map{max-width:440px;}
  .rg{cursor:pointer;transition:fill .14s ease, opacity .14s ease;stroke:#fff;stroke-width:1.4;stroke-linejoin:round;}
  .rg:hover{filter:brightness(.94);}
  .rg.sel{stroke-width:2.4;}
  .rg.dim{opacity:.28;}
  .rlabel{font-size:13.5px;font-weight:600;fill:#333c48;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3.6px;stroke-linejoin:round;}
  .rlabel.sm{font-size:12.5px;fill:#4d5765;}
  .leader{stroke:#b3bac5;stroke-width:1.1;fill:none;pointer-events:none;}
  .isl{stroke:#fff;stroke-width:1.1;cursor:pointer;}
  .cell{cursor:pointer;stroke:#fff;stroke-width:1;stroke-linejoin:round;transition:fill .13s ease;}
  .cell:hover{filter:brightness(.93);}
  .cell.on{stroke:#fff;stroke-width:2;}
  .rout{fill:none;stroke:#fff;stroke-width:3.2;stroke-linejoin:round;pointer-events:none;}
  .rout.on{stroke:#2b333d;stroke-width:1.9;}
  .inset{fill:none;stroke:#dfe3e9;stroke-width:1;stroke-dasharray:4 4;}
  .insetlab{font-size:12px;fill:var(--ink-3);}
  .citydot{fill:#161a1f;stroke:#fff;stroke-width:1.8;pointer-events:none;}
  .citylab{font-size:14px;font-weight:700;fill:#161a1f;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{appearance:none;border:0;background:var(--panel);cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 13px;transition:.15s;}
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--accent);color:#fff;}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none;}
  .switch input{position:absolute;opacity:0;pointer-events:none;}
  .track{width:34px;height:20px;border-radius:99px;background:#d7dbe2;position:relative;transition:.18s;flex:none;}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.18s;}
  .switch input:checked + .track{background:var(--accent);}
  .switch input:checked + .track::after{transform:translateX(14px);}

  .empty{color:var(--ink-3);font-size:13.5px;text-align:center;padding:38px 8px;line-height:1.7;}
  .rtitle{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .swatch{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08);}
  .rtitle h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;}
  .rtype{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;}
  .facts{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line-2);}
  .facts li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;}
  .facts b{flex:none;width:92px;color:var(--ink-3);font-weight:600;}
  .facts span{color:var(--ink);}
  .subhead{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{font-size:12.5px;padding:4px 9px;border-radius:7px;background:#f1f3f7;color:#3d4653;}
  .chip.g{background:#f6f2e9;color:#6b5f43;}
  .chip.u{background:#eef1f9;color:#49527090;color:#495270;}
  .note{margin-top:14px;font-size:12.5px;color:var(--ink-2);background:#f7f8fa;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;line-height:1.6;}

  .quizbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid #d7e2ff;border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .quizbar .q{font-size:15px;font-weight:700;color:#1c3fa5;}
  .quizbar .q em{font-style:normal;font-size:18px;}
  .quizbar .s{font-size:13px;color:#3f5ea8;font-weight:600;font-variant-numeric:tabular-nums;}
  .quizbar.ok{background:var(--ok-soft);border-color:#c6ead8;}
  .quizbar.ok .q,.quizbar.ok .s{color:#166b46;}
  .quizbar.no{background:var(--no-soft);border-color:#f6cfcb;}
  .quizbar.no .q,.quizbar.no .s{color:#a3352c;}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:9px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 13px;cursor:pointer;transition:.15s;}
  .btn:hover{border-color:#c9d0da;color:var(--ink);}

  .search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:#fbfcfd;}
  .search:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(47,98,232,.12);}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;}
  .fchip{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:4px 11px;cursor:pointer;transition:.14s;}
  .fchip:hover{border-color:#c9d0da;}
  .fchip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .citylist{position:relative;max-height:420px;overflow:auto;margin-top:14px;padding-right:4px;}
  .grp{margin-bottom:15px;}
  .grp h4{margin:0 0 7px;font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:7px;}
  .grid{display:flex;flex-wrap:wrap;gap:6px;}
  .cbtn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;font:inherit;font-size:13px;color:var(--ink);padding:5px 10px;cursor:pointer;transition:.14s;}
  .cbtn:hover{border-color:var(--accent);color:var(--accent);}
  .cbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cbtn .t{font-size:10.5px;color:var(--ink-3);margin-left:4px;}
  .cbtn.on .t{color:#cfdcff;}
  .answer{border:1px solid var(--line-2);background:#fbfcfd;border-radius:12px;padding:14px;margin-bottom:6px;}
  .answer .big{font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .answer .arrow{color:var(--ink-3);}
  .answer .path{font-size:12.5px;color:var(--ink-2);margin-top:5px;}
  .cnt{font-size:12px;color:var(--ink-3);font-weight:600;}
  .spot{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);}
  .spot .art{line-height:0;background:#eef2f5;}
  .spot .art svg{display:block;width:100%;height:auto;}
  .spot .sb{padding:12px 14px 14px;}
  .spot .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .spot .sh b{font-size:15px;letter-spacing:-.01em;}
  .spot .tag{font-size:11px;font-weight:700;color:#8a6a1f;background:#fbf3dd;padding:2px 8px;border-radius:99px;}
  .spot p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .spot .cap{margin-top:8px;font-size:11.5px;color:var(--ink-3);}
  .spotdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#c9992a;margin-left:5px;vertical-align:2px;}
  .cbtn.on .spotdot{background:#ffd977;}
  .spotmark{cursor:pointer;}
  /* 확대 시 선·글자 크기를 화면 기준으로 일정하게 유지 */
  #map2 svg{--k:1;}
  #map2 .cell{stroke-width:calc(1px * var(--k));}
  #map2 .cell.on{stroke-width:calc(2px * var(--k));}
  #map2 .rout{stroke-width:calc(3.2px * var(--k));}
  #map2 .rout.on{stroke-width:calc(1.9px * var(--k));}
  #map2 .isl,#map2 .inset{stroke-width:calc(1.1px * var(--k));}
  #map2 .leader{stroke-width:calc(1.1px * var(--k));}
  #map2 .rlabel{font-size:calc(13.5px * var(--k));stroke-width:calc(3.6px * var(--k));}
  #map2 .rlabel.sm{font-size:calc(12.5px * var(--k));}
  #map2 .insetlab{font-size:calc(12px * var(--k));}
  #map2 .citylab{font-size:calc(14px * var(--k));stroke-width:calc(4px * var(--k));}
  #map2 .citydot{stroke-width:calc(1.8px * var(--k));}
  .clab{font-size:calc(10px * var(--k));font-weight:600;fill:#39424e;pointer-events:none;
        paint-order:stroke;stroke:#fff;stroke-width:calc(2.8px * var(--k));stroke-linejoin:round;}
  .rlabel.far{fill:#9aa3ae;}
  .cseed{fill:#6b7280;pointer-events:none;}
  #map2 svg.zoomed .rgroup:not(.focus){opacity:.34;}
  #map2 svg.zoomed .rout:not(.on){opacity:.45;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:10px 16px 0;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d5d9e0;border-radius:99px;border:2px solid var(--panel);}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:900px){
    .cols{grid-template-columns:1fr;}
    .wrap{padding:16px 14px 40px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>한반도 행정구역 익히기</h1>
      <p>지도를 눌러 광역자치단체를 확인하고, 도시가 어느 행정구역에 속하는지 찾아보세요.</p>
    </div>
    <nav class="tabs">
      <button id="tabMap" class="on">지도에서 찾기</button>
      <button id="tabCity">도시로 찾기</button>
    </nav>
  </header>

  <section id="viewMap">
    <div id="quizbar" class="quizbar" style="display:none">
      <div class="q" id="quizQ"></div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="s" id="quizS"></div>
        <button class="btn" id="quizSkip">넘기기</button>
        <button class="btn" id="quizReset">처음부터</button>
      </div>
    </div>

    <div class="cols">
      <div class="card">
        <div class="hd">
          <h2>대한민국 광역자치단체</h2>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <div class="seg">
              <button id="modeLearn" class="on">학습 모드</button>
              <button id="modeBlind">이름 숨기기</button>
              <button id="modeQuiz">퀴즈 모드</button>
            </div>
            <button class="btn" id="blindReset" style="display:none">다시 숨기기</button>
            <label class="switch" title="광주광역시와 전라남도를 하나로 합쳐서 봅니다">
              <input type="checkbox" id="mergeToggle"><span class="track"></span>
              <span>통합 개편안 반영</span>
            </label>
          </div>
        </div>
        <div class="legend">
          <span><i style="background:hsl(20 48% 70%)"></i>특별시 · 광역시 · 특별자치시</span>
          <span><i style="background:hsl(160 40% 82%)"></i>도 · 특별자치도</span>
        </div>
        <div class="bd mapbox" id="map1"></div>
      </div>

      <div class="card">
        <div class="hd"><h2>선택한 행정구역</h2></div>
        <div class="bd" id="info1">
          <div class="empty">지도에서 지역을 눌러 보세요.<br>이름 · 청사 소재지 · 소속 시·군·구가 나타납니다.</div>
        </div>
      </div>
    </div>
  </section>

  <section id="viewCity" style="display:none">
    <div class="cols">
      <div class="card">
        <div class="hd">
          <h2>시 · 군 지도</h2>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="cnt" id="mapHint">도 안이 시·군으로 나뉘어 있습니다. 눌러 보세요.</span>
            <button class="btn" id="zoomOut" style="display:none">전체 보기</button>
          </div>
        </div>
        <div class="legend">
          <span><i style="background:hsl(20 50% 72%)"></i>특별시 · 광역시 · 특별자치시(그 자체가 하나의 도시)</span>
          <span><i style="background:hsl(160 36% 84%)"></i>도 · 특별자치도 안의 시 · 군</span>
        </div>
        <div class="bd mapbox" id="map2"></div>
      </div>

      <div class="card">
        <div class="hd">
          <h2>소속 행정구역</h2>
          <span class="cnt" id="cityCount"></span>
        </div>
        <div class="bd">
          <div id="answer"></div>
          <input class="search" id="citySearch" placeholder="도시 이름을 검색하세요 (예: 여수, 청주, 포항)" style="margin-top:14px">
          <div class="filters" id="typeFilters"></div>
          <div class="filters" id="regionFilters"></div>
          <div class="citylist" id="cityList"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>

<script>
/* =========================================================
   렌더링 & 상호작용
   ========================================================= */
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let merged = false;
let mode = 'learn';           // learn · blind · quiz
let revealed = new Set();     // 이름 숨기기 모드에서 확인한 지역
let selected = null;          // 지도 탭에서 선택된 지역 id
let selectedCity = null;      // 도시 탭에서 선택된 도시

const withGeo = (r)=>({ ...r, d:SIDOGEO[r.id].d, pt:SIDOGEO[r.id].p, box:SIDOGEO[r.id].b });
function regions(){
  if(!merged) return DATA.map(withGeo);
  const out = [];
  for(const r of DATA){
    if(r.id==='gwangju') continue;
    if(r.id==='jeonnam'){
      const g = DATA.find(x=>x.id==='gwangju');
      out.push(withGeo({...MERGED, subs:[...r.subs, ...g.subs.map(s=>({n:'광주 '+s.n, t:'구'}))]}));
      continue;
    }
    out.push(withGeo(r));
  }
  return out;
}
function regionById(id){ return regions().find(r=>r.id===id); }

/* 도시 → 지역 매핑 */
function allCities(){
  const list = [];
  for(const r of regions()){
    for(const s of (r.subs||[])) list.push({...s, region:r});
  }
  return list;
}

/* ---------- 색 ---------- */
function fillOf(r, state){
  const h = r.hue, metro = !!r.metro;
  if(state==='sel')   return `hsl(${h} ${metro?68:60}% ${metro?50:54}%)`;
  if(state==='hover') return `hsl(${h} ${metro?60:52}% ${metro?62:74}%)`;
  return metro ? `hsl(${h} 56% 68%)` : `hsl(${h} 45% 84%)`;
}

/* ---------- 지도 SVG ---------- */
function pathOf(r){ return r.d; }

/* 시·군 단위 도형 (통계청 경계) */
const ULBOX = [402,716,206,132];               // 울릉도·독도 안내상자
function unitsOf(r){
  const out = [];
  const gid = (r.id==='jn_gj') ? 'jeonnam' : r.id;
  const core = UNITGEO[gid+'/@core'];
  if(core) out.push({ n:'', t:r.type, d:core.d, p:core.p, core:true });
  for(const s of (r.subs||[])){
    let k = gid+'/'+s.n;
    if(r.id==='jn_gj' && s.n.startsWith('광주 ')) k = 'gwangju/'+s.n.slice(3);
    const g = UNITGEO[k];
    if(g) out.push({ n:s.n, t:s.t, d:g.d, p:g.p });
  }
  return out;
}

function buildMap({sel=null, labels="all", dimOthers=false, interactive=true}={}){
  const shows = (r)=> labels==="all" ? true : labels==="none" ? false : labels.has(r.id);
  const rs = regions();
  let s = `<svg class="map" viewBox="${VIEWFULL.join(' ')}" role="img" aria-label="대한민국 행정구역 지도">`;

  // 광역자치단체
  for(const r of rs){
    const on = sel===r.id;
    const cls = 'rg' + (on?' sel':'') + (dimOthers && sel && !on ? ' dim':'');
    s += `<path class="${cls}" data-id="${r.id}" fill="${fillOf(r, on?'sel':'base')}" fill-rule="evenodd" d="${pathOf(r)}"${interactive?'':' style="cursor:default;pointer-events:none"'}><title>${shows(r)? esc(r.name) : '?'}</title></path>`;
  }
  // 울릉도 · 독도 (경상북도 울릉군)
  const gb = rs.find(x=>x.id==='gyeongbuk');
  const ul = UNITGEO['gyeongbuk/울릉군'];
  const gbOn = sel==='gyeongbuk';
  s += `<rect class="inset" x="${ULBOX[0]}" y="${ULBOX[1]}" width="${ULBOX[2]}" height="${ULBOX[3]}" rx="10"></rect>`;
  s += `<path class="rg${gbOn?' sel':''}${dimOthers && sel && !gbOn?' dim':''}" data-id="gyeongbuk" fill="${fillOf(gb, gbOn?'sel':'base')}" d="${ul.d}"${interactive?'':' style="cursor:default;pointer-events:none"'}><title>울릉군 · 경상북도</title></path>`;
  s += `<text class="insetlab" x="${(ULBOX[0]+ULBOX[2]/2).toFixed(0)}" y="${(ULBOX[1]+ULBOX[3]-30).toFixed(0)}" text-anchor="middle">울릉도 · 독도 (경상북도 울릉군)</text>`;
  s += `<text class="insetlab" x="${(ULBOX[0]+ULBOX[2]/2).toFixed(0)}" y="${(ULBOX[1]+ULBOX[3]-13).toFixed(0)}" text-anchor="middle">실제보다 가깝게 그렸습니다</text>`;

  // 지역 이름
  {
    for(const r of rs){
      if(!shows(r)) continue;
      const L = r.label || {};
      const a = r.pt;
      const tx = a[0]+(L.dx||0), ty = a[1]+(L.dy||0);
      if(L.leader){
        const gap = (L.anchor==='end') ? 6 : -6;
        s += `<path class="leader" d="M ${a[0].toFixed(1)} ${a[1].toFixed(1)} L ${(tx+gap).toFixed(1)} ${(ty-4).toFixed(1)}"></path>`;
        s += `<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="2.4" fill="#7a838f"></circle>`;
      }
      s += `<text class="rlabel${L.leader?' sm':''}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${L.anchor||'middle'}">${esc(r.name)}</text>`;
    }
  }
  s += '</svg>';
  return s;
}

/* ---------- 탭 1 : 지도 ---------- */
function renderMap1(){
  $('#map1').innerHTML = buildMap({
    sel: selected,
    labels: mode==='learn' ? 'all' : mode==='blind' ? revealed : 'none',
    dimOthers: false
  });
  $('#map1').querySelectorAll('[data-id]').forEach(el=>{
    el.addEventListener('click', ()=>onPick(el.dataset.id));
    el.addEventListener('mouseenter', ()=>{
      const r = regionById(el.dataset.id);
      if(r && el.dataset.id!==selected) el.setAttribute('fill', fillOf(r,'hover'));
    });
    el.addEventListener('mouseleave', ()=>{
      const r = regionById(el.dataset.id);
      if(r && el.dataset.id!==selected) el.setAttribute('fill', fillOf(r,'base'));
    });
  });
}

function typeChip(t){
  if(t==='군') return 'chip g';
  if(t==='구'||t==='읍면') return 'chip u';
  return 'chip';
}

function emptyInfo(){
  if(mode==='blind'){
    const rs = regions();
    return `<ul class="facts" style="border-top:0;margin-top:0">
        <li><b>확인한 지역</b><span>${revealed.size} / ${rs.length}</span></li>
      </ul>
      <div class="subhead">지금까지 확인한 지역</div>
      <div class="chips">${revealed.size ? rs.filter(r=>revealed.has(r.id)).map(r=>`<span class="chip">${esc(r.name)}</span>`).join('') : '<span class="chip">아직 없어요</span>'}</div>
      <div class="note">이름이 가려져 있습니다. 지역을 눌러 이름을 확인해 보세요. 머릿속으로 먼저 답을 떠올린 뒤 눌러 보면 좋습니다.</div>`;
  }
  if(mode==='quiz'){
    const solved = quiz.order.slice(0, quiz.i).map(id=>regionById(id)).filter(Boolean);
    return `<ul class="facts" style="border-top:0;margin-top:0">
        <li><b>맞힌 개수</b><span>${quiz.right} / ${quiz.order.length}</span></li>
        <li><b>틀린 횟수</b><span>${quiz.wrong}</span></li>
      </ul>
      <div class="subhead">지금까지 찾은 지역</div>
      <div class="chips">${solved.length ? solved.map(r=>`<span class="chip">${esc(r.name)}</span>`).join('') : '<span class="chip">아직 없어요</span>'}</div>
      <div class="note">이름을 보고 해당 지역을 지도에서 눌러 보세요. 맞히면 다음 문제로 넘어갑니다.</div>`;
  }
  return `<div class="empty">지도에서 지역을 눌러 보세요.<br>이름 · 청사 소재지 · 소속 시·군·구가 나타납니다.</div>`;
}

function renderInfo(r){
  if(!r){ $('#info1').innerHTML = emptyInfo(); return; }
  const subs = r.subs||[];
  const cnt = {};
  subs.forEach(s=>cnt[s.t]=(cnt[s.t]||0)+1);
  const cntTxt = Object.keys(cnt).map(k=>`${cnt[k]}${k}`).join(' · ') || '—';
  $('#info1').innerHTML = `
    <div class="rtitle"><span class="swatch" style="background:${fillOf(r,'sel')}"></span><h3>${esc(r.name)}</h3></div>
    <span class="rtype">${esc(r.type)}</span>
    <ul class="facts">
      <li><b>줄임 이름</b><span>${esc(r.short)}</span></li>
      <li><b>청사 소재지</b><span>${esc(r.seat)}</span></li>
      <li><b>하위 행정구역</b><span>${esc(cntTxt)}</span></li>
    </ul>
    <div class="subhead">소속 시 · 군 · 구</div>
    <div class="chips">${subs.map(s=>`<span class="${typeChip(s.t)}">${esc(s.n)}</span>`).join('')}</div>
    <div class="note">${esc(r.desc)}</div>`;
}

/* ---------- 퀴즈 ---------- */
let quiz = { order:[], i:0, right:0, wrong:0, done:false };
function startQuiz(){
  const ids = regions().map(r=>r.id);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  quiz = { order:ids, i:0, right:0, wrong:0, done:false };
  selected = null;
  renderMap1(); renderInfo(null); paintQuiz();
}
function paintQuiz(state){
  const bar = $('#quizbar');
  bar.className = 'quizbar' + (state? ' '+state : '');
  if(!selected) renderInfo(null);
  if(quiz.done){
    $('#quizQ').innerHTML = `모두 풀었습니다! 정답 <em>${quiz.right}</em> / ${quiz.order.length}`;
    $('#quizS').textContent = '';
    return;
  }
  const r = regionById(quiz.order[quiz.i]);
  $('#quizQ').innerHTML = state==='ok' ? `정답! <em>${esc(r.name)}</em>`
                      : state==='no' ? `아쉬워요. 다시 찾아보세요 → <em>${esc(r.name)}</em>`
                      : `<em>${esc(r.name)}</em> 을(를) 지도에서 찾아 눌러 보세요`;
  $('#quizS').textContent = `${quiz.i+1} / ${quiz.order.length}  ·  정답 ${quiz.right}  오답 ${quiz.wrong}`;
}
function onPick(id){
  if(mode==='learn'){
    selected = (selected===id) ? null : id;
    renderMap1(); renderInfo(regionById(selected));
    return;
  }
  if(mode==='blind'){
    revealed.add(id);
    selected = id;
    renderMap1(); renderInfo(regionById(id));
    return;
  }
  if(quiz.done) return;
  const want = quiz.order[quiz.i];
  if(id===want){
    quiz.right++; selected = id; renderMap1(); renderInfo(regionById(id)); paintQuiz('ok');
    setTimeout(()=>{ quiz.i++; selected=null;
      if(quiz.i>=quiz.order.length){ quiz.done=true; renderMap1(); paintQuiz(); }
      else { renderMap1(); paintQuiz(); }
    }, 850);
  } else {
    quiz.wrong++; paintQuiz('no');
  }
}

/* ---------- 탭 2 : 도시 ---------- */
let filterType = '전체';
let filterRegion = '전체';
let query = '';

function renderFilters(){
  const types = ['전체','시','군','구','읍면','행정시'];
  $('#typeFilters').innerHTML = types.map(t=>
    `<button class="fchip${filterType===t?' on':''}" data-type="${t}">${t==='전체'?'전체 유형':t}</button>`).join('');
  $('#typeFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{ filterType=b.dataset.type; renderFilters(); renderCityList(); });

  const rs = regions();
  $('#regionFilters').innerHTML = `<button class="fchip${filterRegion==='전체'?' on':''}" data-r="전체">전체 지역</button>` +
    rs.map(r=>`<button class="fchip${filterRegion===r.id?' on':''}" data-r="${r.id}">${esc(r.short)}</button>`).join('');
  $('#regionFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{ filterRegion=b.dataset.r; renderFilters(); renderCityList(); });
}

function renderCityList(){
  const rs = regions();
  const q = query.trim();
  let total = 0;
  let html = '';
  for(const r of rs){
    if(filterRegion!=='전체' && filterRegion!==r.id) continue;
    let subs = (r.subs||[]).filter(s=>{
      if(filterType!=='전체' && s.t!==filterType) return false;
      if(q && !s.n.includes(q) && !r.name.includes(q) && !r.short.includes(q)) return false;
      return true;
    });
    if(!subs.length) continue;
    total += subs.length;
    html += `<div class="grp"><h4><span class="swatch" style="width:10px;height:10px;background:${fillOf(r,'sel')}"></span>${esc(r.name)} <span class="cnt">${subs.length}</span></h4>
      <div class="grid">${subs.map(s=>{
        const on = selectedCity && selectedCity.n===s.n && selectedCity.region.id===r.id;
        const sp = SPOTS[r.id+'/'+s.n];
        return `<button class="cbtn${on?' on':''}" data-r="${r.id}" data-n="${esc(s.n)}"${sp?` title="${esc(sp.name)}"`:''}>${esc(s.n)}<span class="t">${esc(s.t)}</span>${sp?'<span class="spotdot"></span>':''}</button>`;
      }).join('')}</div></div>`;
  }
  $('#cityList').innerHTML = html || `<div class="empty">검색 결과가 없습니다.</div>`;
  $('#cityCount').textContent = `${total}곳`;
  $('#cityList').querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{
    pickCity(b.dataset.r, b.dataset.n);
  });
  const onBtn = $('#cityList .cbtn.on');
  if(onBtn){
    const box = $('#cityList');
    box.scrollTop = Math.max(0, onBtn.offsetTop - 70);
  }
}

/* ===== 시·군 도형 (통계청 실제 경계) ===== */
let cellCache = null;
function cells(){
  if(cellCache) return cellCache;
  const out = {};
  for(const r of regions()) out[r.id] = unitsOf(r);
  cellCache = out;
  return out;
}
function cellOf(regionId, name){
  const cs = cells()[regionId] || [];
  return cs.find(c => name ? c.n===name : c.core) || null;
}
function cellFill(r, i, on){
  if(on) return fillOf(r, 'sel');
  const L = (r.metro ? 66 : 75) + ((i*3)%5)*3.2;   // 같은 지역 안에서 살짝씩 다른 밝기
  const S = r.metro ? 50 : 34 + ((i*2)%3)*5;
  return `hsl(${r.hue} ${S}% ${L}%)`;
}

/* ===== 확대(줌) ===== */
const FULLVIEW = VIEWFULL.slice();
const AR = FULLVIEW[2]/FULLVIEW[3];
let mapView = FULLVIEW.slice();
let zoomRegion = null;
let viewAnim = 0;

function regionBox(r){ return r.box.slice(); }
function fitBox(b, pad, minW){
  let [x0,y0,x1,y1] = b;
  x0-=pad; y0-=pad; x1+=pad; y1+=pad;
  let w = Math.max(x1-x0, minW||0), h = y1-y0;
  if(w/h > AR) h = w/AR; else w = h*AR;
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return [cx-w/2, cy-h/2, w, h];
}
function targetView(){
  if(!zoomRegion) return FULLVIEW.slice();
  const r = regionById(zoomRegion);
  if(!r) return FULLVIEW.slice();
  const b = regionBox(r);
  if(selectedCity && selectedCity.n==='울릉군')   // 본토 + 울릉도 안내상자를 함께
    return fitBox([Math.min(b[0],ULBOX[0]-6), Math.min(b[1],ULBOX[1]-6),
                   Math.max(b[2],ULBOX[0]+ULBOX[2]+6), Math.max(b[3],ULBOX[1]+ULBOX[3]+6)], 20, 260);
  return fitBox(b, 18, 110);
}
let viewSnap = 0;
function applyView(){
  const svg = document.querySelector('#map2 svg');
  if(svg) svg.setAttribute('viewBox', mapView.map(v=>v.toFixed(1)).join(' '));
}
function animateView(to){
  cancelAnimationFrame(viewAnim); clearTimeout(viewSnap);
  const from = mapView.slice(), t0 = performance.now(), D = 460;
  let done = false;
  const step = (t)=>{
    const k = Math.min(1, (t-t0)/D);
    const e = k<0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    mapView = from.map((v,i)=> v + (to[i]-v)*e);
    applyView();
    if(k<1) viewAnim = requestAnimationFrame(step); else done = true;
  };
  viewAnim = requestAnimationFrame(step);
  // 탭이 백그라운드라 애니메이션이 돌지 않는 경우를 대비한 보정
  viewSnap = setTimeout(()=>{ if(!done){ mapView = to.slice(); applyView(); } }, D + 140);
}

/* ===== 탭 2 지도 ===== */
function buildCityMap(){
  const rs = regions();
  const CS = cells();
  const selR = selectedCity ? selectedCity.region.id : null;
  const selN = selectedCity && !selectedCity.isRegion ? selectedCity.n : null;
  const tv = targetView();
  const k  = tv[2]/FULLVIEW[2];
  const zoomed = !!zoomRegion;
  const short = n => n.replace(/(시|군|구)$/,'');

  let body = '';

  // 시·군 도형
  for(const r of rs){
    const cs = CS[r.id] || [];
    const named = new Set(cs.map(c=>c.n).filter(Boolean));
    body += `<g class="rgroup${r.id===zoomRegion?' focus':''}">`;
    cs.forEach((c,i)=>{
      const on = (r.id===selR) && (c.core ? !named.has(selN) : c.n===selN);
      const label = c.core ? r.name : c.n + ' · ' + r.name;
      body += `<path class="cell${on?' on':''}" data-r="${r.id}" data-n="${esc(c.n)}" fill-rule="evenodd" fill="${cellFill(r,i,on)}" d="${c.d}"><title>${esc(label)}</title></path>`;
    });
    body += `</g>`;
  }

  // 울릉도·독도 안내상자 테두리
  body += `<rect class="inset" x="${ULBOX[0]}" y="${ULBOX[1]}" width="${ULBOX[2]}" height="${ULBOX[3]}" rx="10"></rect>`;
  body += `<text class="insetlab" x="${(ULBOX[0]+ULBOX[2]/2).toFixed(0)}" y="${(ULBOX[1]+ULBOX[3]-30).toFixed(0)}" text-anchor="middle">울릉도 · 독도 (경상북도 울릉군)</text>`;
  body += `<text class="insetlab" x="${(ULBOX[0]+ULBOX[2]/2).toFixed(0)}" y="${(ULBOX[1]+ULBOX[3]-13).toFixed(0)}" text-anchor="middle">실제보다 가깝게 그렸습니다</text>`;

  // 광역자치단체 경계선
  for(const r of rs) body += `<path class="rout${r.id===selR?' on':''}" d="${pathOf(r)}"/>`;

  // 명소가 있는 시·군 표시
  for(const key of Object.keys(SPOTS)){
    const i = key.indexOf('/'), rid = key.slice(0,i), cn = key.slice(i+1);
    const c = cellOf(rid, cn); if(!c) continue;
    body += `<g class="spotmark" data-r="${rid}" data-n="${esc(cn)}">
      <circle cx="${c.p[0]}" cy="${c.p[1]}" r="${(6*k).toFixed(2)}" fill="#fff" stroke="#c9992a" stroke-width="${(2*k).toFixed(2)}"></circle>
      <circle cx="${c.p[0]}" cy="${c.p[1]}" r="${(2.4*k).toFixed(2)}" fill="#c9992a"></circle>
      <title>${esc(cn)} · ${esc(SPOTS[key].name)}</title></g>`;
  }

  // 확대했을 때: 그 지역 안의 시·군 이름
  if(zoomed){
    for(const c of (CS[zoomRegion]||[])){
      if(!c.n || c.n===selN) continue;              // 선택한 곳은 큰 이름표로 따로
      body += `<text class="clab" x="${c.p[0]}" y="${(c.p[1]+3.4*k).toFixed(1)}" text-anchor="middle">${esc(short(c.n))}</text>`;
    }
  }

  // 광역자치단체 이름
  for(const r of rs){
    const L = r.label || {};
    const a = r.pt;
    // 확대 중에는 이웃 지역 이름만 (해당 지역 이름은 카드 머리말에 표시)
    if(zoomed && r.id===zoomRegion) continue;
    if(zoomed && (a[0]<tv[0] || a[0]>tv[0]+tv[2] || a[1]<tv[1] || a[1]>tv[1]+tv[3])) continue;
    // 확대 중에는 지시선 없이 지역 한가운데에 이름을 놓는다
    const tx = a[0]+(zoomed?0:(L.dx||0)), ty = a[1]+(zoomed?0:(L.dy||0));
    if(L.leader && !zoomed){
      const gap = (L.anchor==='end') ? 6 : -6;
      body += `<path class="leader" d="M ${a[0].toFixed(1)} ${a[1].toFixed(1)} L ${(tx+gap).toFixed(1)} ${(ty-4).toFixed(1)}"></path>`;
    }
    const far = zoomed ? ' far' : '';
    body += `<text class="rlabel${L.leader?' sm':''}${far}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${(zoomed?'middle':(L.anchor||'middle'))}">${esc(r.name)}</text>`;
  }

  // 선택한 도시 이름표
  if(selectedCity){
    const cell = cellOf(selR, selN);
    const at = cell ? cell.p : (regionById(selR)||{pt:[0,0]}).pt;
    const right = at[0] < (zoomed ? mapView[0]+mapView[2]*0.55 : FULLVIEW[0]+FULLVIEW[2]*0.6);
    if(cell && !cell.core)
      body += `<circle class="citydot" cx="${at[0]}" cy="${at[1]}" r="${(4.5*k).toFixed(2)}"></circle>`;
    body += `<text class="citylab" x="${(at[0]+(right?11*k:-11*k)).toFixed(1)}" y="${(at[1]+4.5*k).toFixed(1)}" text-anchor="${right?'start':'end'}">${esc(selectedCity.n)}</text>`;
  }

  const vb = mapView.map(v=>v.toFixed(1)).join(' ');
  return `<svg class="map${zoomed?' zoomed':''}" style="--k:${k.toFixed(4)}" viewBox="${vb}" role="img" aria-label="대한민국 시·군 지도">${body}</svg>`;
}

function pickCity(regionId, cityName){
  const r = regionById(regionId); if(!r) return;
  const s = cityName ? (r.subs||[]).find(x=>x.n===cityName) : null;
  selectedCity = s ? {...s, region:r} : {n:r.name, t:r.type, c:null, region:r, isRegion:true};
  zoomRegion = r.id;
  renderCityList(); renderAnswer();
}
function resetZoom(){
  zoomRegion = null;
  renderAnswer();
}

function spotCard(regionId, cityName){
  const sp = SPOTS[regionId + '/' + cityName];
  if(!sp) return '';
  return `<div class="spot">
      <div class="art">${sp.art}</div>
      <div class="sb">
        <div class="sh"><b>${esc(sp.name)}</b><span class="tag">${esc(sp.tag)}</span></div>
        <p>${esc(sp.desc)}</p>
        <div class="cap">※ 사진이 아니라 이해를 돕기 위해 그린 그림입니다.</div>
      </div>
    </div>`;
}

function renderAnswer(){
  if(!selectedCity){
    $('#answer').innerHTML = `<div class="empty" style="padding:22px 8px">지도에서 시·군을 누르거나<br>아래 목록에서 도시를 골라 보세요.</div>`;
  } else if(selectedCity.isRegion){
    const r = selectedCity.region;
    $('#answer').innerHTML = `
      <div class="answer">
        <div class="big"><span class="swatch" style="background:${fillOf(r,'sel')}"></span><span>${esc(r.name)}</span></div>
        <div class="path">${esc(r.type)} · 그 자체가 광역자치단체입니다 · 청사 ${esc(r.seat)}</div>
      </div>
      <div class="subhead">소속 시 · 군 · 구</div>
      <div class="chips">${(r.subs||[]).map(s=>`<span class="${typeChip(s.t)}">${esc(s.n)}</span>`).join('')}</div>`;
  } else {
    const r = selectedCity.region;
    const sameKind = (r.subs||[]).filter(s=>s.t===selectedCity.t && s.n!==selectedCity.n);
    $('#answer').innerHTML = `
      <div class="answer">
        <div class="big"><span>${esc(selectedCity.n)}</span><span class="arrow">→</span>
          <span class="swatch" style="background:${fillOf(r,'sel')}"></span><span>${esc(r.name)}</span></div>
        <div class="path">${esc(r.type)} · 청사 ${esc(r.seat)}</div>
      </div>
      ${spotCard(r.id, selectedCity.n)}
      <div class="subhead">같은 행정구역의 다른 ${esc(selectedCity.t)}</div>
      <div class="chips">${sameKind.length? sameKind.map(s=>`<span class="${typeChip(s.t)}">${esc(s.n)}</span>`).join('') : '<span class="chip">없음</span>'}</div>`;
  }
  $('#map2').innerHTML = buildCityMap();
  $('#map2').querySelectorAll('[data-r]').forEach(el=>{
    el.addEventListener('click', ()=>pickCity(el.dataset.r, el.dataset.n));
  });
  animateView(targetView());
  const zr = zoomRegion ? regionById(zoomRegion) : null;
  $('#zoomOut').style.display = zr ? '' : 'none';
  $('#mapHint').textContent = !zr ? '도 안이 시·군으로 나뉘어 있습니다. 눌러 보세요.'
    : ((cells()[zr.id]||[]).length > 1 ? `${zr.name} 안에서의 위치입니다.` : `${zr.name}를 확대했습니다.`);
}

/* ---------- 이벤트 ---------- */
$('#tabMap').onclick = ()=>{ $('#tabMap').classList.add('on'); $('#tabCity').classList.remove('on'); $('#viewMap').style.display=''; $('#viewCity').style.display='none'; };
$('#tabCity').onclick = ()=>{ $('#tabCity').classList.add('on'); $('#tabMap').classList.remove('on'); $('#viewCity').style.display=''; $('#viewMap').style.display='none'; };

function setMode(m){
  mode = m;
  for(const [id,key] of [['modeLearn','learn'],['modeBlind','blind'],['modeQuiz','quiz']])
    $('#'+id).classList.toggle('on', key===m);
  $('#quizbar').style.display = (m==='quiz') ? '' : 'none';
  $('#blindReset').style.display = (m==='blind') ? '' : 'none';
  selected = null;
  if(m==='quiz'){ startQuiz(); return; }
  if(m==='blind') revealed.clear();
  renderMap1(); renderInfo(null);
}
$('#modeLearn').onclick = ()=> setMode('learn');
$('#modeBlind').onclick = ()=> setMode('blind');
$('#modeQuiz').onclick  = ()=> setMode('quiz');
$('#blindReset').onclick = ()=>{ revealed.clear(); selected=null; renderMap1(); renderInfo(null); };
$('#quizSkip').onclick = ()=>{ if(quiz.done) return; quiz.wrong++; quiz.i++;
  if(quiz.i>=quiz.order.length){ quiz.done=true; } selected=null; renderMap1(); paintQuiz(); };
$('#quizReset').onclick = ()=> startQuiz();

$('#mergeToggle').onchange = (e)=>{
  merged = e.target.checked;
  selected = null; selectedCity = null; cellCache = null; zoomRegion = null;
  if(filterRegion==='gwangju'||filterRegion==='jeonnam'||filterRegion==='jn_gj') filterRegion='전체';
  renderMap1(); renderInfo(null);
  renderFilters(); renderCityList(); renderAnswer();
  revealed.clear();
  if(mode==='quiz') startQuiz();
};
